name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      BASE_URL: https://practicesoftwaretesting.com
      API_URL: https://api.practicesoftwaretesting.com
      GITHUB_API_URL: https://api.github.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: >
          python -m pytest
          --browser ${{ matrix.browser }}
          --tracing retain-on-failure
          --output test-results/${{ matrix.browser }}
          --html=report-${{ matrix.browser }}.html
          --self-contained-html

      - name: Upload report and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.browser }}
          path: |
            report-${{ matrix.browser }}.html
            test-results/${{ matrix.browser }}/